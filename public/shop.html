<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop all gifts — Confetti Club</title>
  <meta name="description" content="Browse every gift: personalized, tech, cozy, under $25 and more. Free shipping over $50." />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Manrope:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <main class="container-cc pb-20 pt-8 sm:pt-10">
    <nav class="text-xs font-bold text-ink/45" aria-label="Breadcrumb">
      <a href="/" class="transition hover:text-ink">Home</a> <span class="mx-1.5">/</span> <span class="text-ink">Shop</span>
    </nav>

    <div class="mt-4 flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="font-display text-4xl font-extrabold sm:text-5xl" id="shop-title">All gifts</h1>
        <p class="mt-2 text-sm font-bold text-ink/50"><span id="result-count">…</span> gifts ready to ship</p>
      </div>
      <div class="flex w-full gap-2.5 sm:w-auto">
        <label class="relative flex-1 sm:w-72">
          <span class="sr-only">Search gifts</span>
          <input id="search-input" type="search" placeholder="Search “mug”, “personalized”…" class="input pr-10" autocomplete="off" />
          <span class="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-ink/35">🔎</span>
        </label>
      </div>
    </div>

    <div class="mt-8 grid gap-8 lg:grid-cols-[240px_1fr]">
      <!-- FILTERS -->
      <aside class="lg:sticky lg:top-24 lg:self-start">
        <details open class="group rounded-[24px] border border-ink/8 bg-white p-5 shadow-soft">
          <summary class="flex cursor-pointer list-none items-center justify-between font-display text-base font-extrabold">
            Filters <span class="text-ink/40 transition group-open:rotate-180">▾</span>
          </summary>

          <div class="mt-5">
            <p class="text-[11px] font-black uppercase tracking-[0.16em] text-ink/40">Category</p>
            <div id="category-filters" class="mt-2.5 flex flex-wrap gap-2">
              <span class="skeleton h-9 w-24 rounded-full"></span>
              <span class="skeleton h-9 w-28 rounded-full"></span>
            </div>
          </div>

          <div class="mt-6">
            <p class="text-[11px] font-black uppercase tracking-[0.16em] text-ink/40">Max price</p>
            <input id="price-range" type="range" min="1000" max="13000" step="500" value="13000" class="mt-3 w-full accent-iris" />
            <div class="mt-1 flex justify-between text-xs font-bold text-ink/50">
              <span>$10</span>
              <span id="price-label">Any price</span>
            </div>
          </div>

          <div class="mt-6 space-y-2.5">
            <label class="flex cursor-pointer items-center gap-2.5 text-sm font-bold text-ink/70">
              <input id="in-stock-only" type="checkbox" class="h-4.5 w-4.5 accent-iris" />
              In stock only
            </label>
            <label class="flex cursor-pointer items-center gap-2.5 text-sm font-bold text-ink/70">
              <input id="featured-only" type="checkbox" class="h-4.5 w-4.5 accent-iris" />
              Bestsellers only
            </label>
          </div>

          <button id="clear-filters" class="btn-outline btn-sm mt-6 w-full">Clear all</button>
        </details>
      </aside>

      <!-- RESULTS -->
      <section>
        <div class="flex items-center justify-between gap-3 rounded-2xl border border-ink/8 bg-white px-4 py-3 shadow-soft">
          <p class="hidden text-sm font-bold text-ink/55 sm:block" id="active-summary">Showing everything</p>
          <label class="ml-auto flex items-center gap-2 text-sm font-bold text-ink/60">
            Sort
            <select id="sort-select" class="rounded-full border-2 border-ink/10 bg-white px-3 py-2 text-sm font-extrabold text-ink focus:border-ink focus:outline-none">
              <option value="featured">Featured</option>
              <option value="popular">Most loved</option>
              <option value="newest">Newest</option>
              <option value="price-asc">Price: low → high</option>
              <option value="price-desc">Price: high → low</option>
              <option value="rating">Top rated</option>
            </select>
          </label>
        </div>

        <div id="product-grid" class="mt-5 grid grid-cols-2 gap-4 sm:gap-5 lg:grid-cols-3">
          <div class="skeleton aspect-[3/4]"></div>
          <div class="skeleton aspect-[3/4]"></div>
          <div class="skeleton aspect-[3/4] hidden lg:block"></div>
        </div>

        <div id="empty-state" class="mt-6 hidden rounded-[28px] border-2 border-dashed border-ink/15 p-12 text-center">
          <span class="text-5xl">🫥</span>
          <h2 class="mt-4 font-display text-2xl font-extrabold">Nothing matches that</h2>
          <p class="mt-2 text-sm font-semibold text-ink/55">Try a different search, or clear the filters and browse everything.</p>
          <button id="empty-clear" class="btn-lime mt-5">Clear filters</button>
        </div>

        <nav id="pagination" class="mt-10 flex items-center justify-center gap-2" aria-label="Pagination"></nav>
      </section>
    </div>
  </main>

  <script type="module" src="/assets/js/pages/shop.js"></script>
</body>
</html>
